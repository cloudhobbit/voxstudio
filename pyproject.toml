[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voxstudio"
version = "0.1.0"
description = "A local, free voice studio: audition, blend and tune AI voices, then narrate scripts with captions. Runs offline."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Vox Studio contributors" }]
keywords = ["tts", "text-to-speech", "kokoro", "voice", "narration", "audiobook", "elevenlabs", "local", "offline"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2",
  "pyyaml>=6",
  "numpy>=1.24",
  "soundfile>=0.12",
]

[project.optional-dependencies]
kokoro = ["kokoro>=0.9.4"]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[project.scripts]
voxstudio = "voxstudio.cli:main"

[project.urls]
Homepage = "https://github.com/cloudhobbit/voxstudio"
Issues = "https://github.com/cloudhobbit/voxstudio/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/voxstudio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["RUF012", "E501", "RUF001", "RUF002", "RUF003"]
