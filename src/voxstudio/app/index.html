<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vox Studio</title>
<meta name="description" content="A local, free voice studio: audition, blend and tune AI voices, then narrate scripts with captions.">
<link rel="stylesheet" href="/app.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%234F46E5'/%3E%3Cpath d='M7 8l5 9 5-9' stroke='white' stroke-width='2.5' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<script>try { const t = localStorage.getItem("vox.theme"); if (t) document.documentElement.dataset.theme = JSON.parse(t); } catch {}</script>
</head>
<body>
<div class="shell">
  <nav class="sidebar" aria-label="Sections">
    <a class="brand" href="#/library"><span class="mark" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 8l5 9 5-9"/></svg></span><span>Vox Studio</span></a>
    <div class="nav" id="nav"></div>
    <div class="spacer"></div>
    <div class="nav" id="nav-bottom"></div>
  </nav>
  <div class="content">
    <header class="topbar">
      <h1 id="title">Library</h1>
      <div id="topbar-actions" class="row"></div>
      <select class="select" id="project-select" aria-label="Current project" style="width:auto;min-height:32px"></select>
      <button class="icon-btn" id="theme-btn" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      <button class="icon-btn" id="help-btn" aria-label="Keyboard shortcuts" title="Keyboard shortcuts (?)"></button>
    </header>
    <div class="progress-line" id="progress" aria-hidden="true"></div>
    <div class="banner" id="banner" role="alert"></div>
    <main class="page" id="main" tabindex="-1"></main>
  </div>
  <footer class="player" id="player" aria-label="Player"></footer>
  <nav class="tabbar" id="tabbar" aria-label="Sections"></nav>
</div>
<div class="toasts" aria-live="polite"></div>
<div id="live" class="sr-only" aria-live="polite"></div>
<dialog id="dialog"></dialog>
<aside class="drawer" id="drawer" aria-label="Details"></aside>
<script type="module" src="/app.js"></script>
</body>
</html>
